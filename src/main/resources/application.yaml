spring:
  application:
    name: skyhyp


  datasource:
    url: jdbc:mysql://localhost:3306/skyhyp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    org.springframework.security: TRACE


server:
  port: 8080

jwt:
  # Generate your own — never reuse this example value in a real environment.
  # e.g. python3 -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}


resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}